name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Embedding pipeline (Python 3.12 + sentence-transformers) ----
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install pipeline deps
        working-directory: pipeline
        run: uv sync --frozen

      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-${{ hashFiles('pipeline/uv.lock') }}

      - name: Build chunks.json + embeddings.bin
        working-directory: pipeline
        run: uv run chunk_and_embed.py

      # ---- Vite build ----
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        # `npm install` over `npm ci`: the lockfile is generated on Windows
        # and skips Linux-only platform-optional packages (e.g. the linux-x64
        # binary of @tailwindcss/oxide), so `npm ci` blows up under "Missing
        # @emnapi/core ... from lock file". `npm install` resolves them on
        # the runner.
        run: npm install --no-audit --no-fund

      - name: Build web
        working-directory: web
        run: npm run build
        env:
          # Cloudflare Pages serves at the domain root (no /UBCLLM/ subpath
          # like GitHub Pages had), so base must be `/`.
          VITE_BASE_PATH: /

      # ---- Deploy to Cloudflare Pages ----
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=ubcllm --branch=master
