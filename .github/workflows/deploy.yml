name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Deployment auth is the Cloudflare API token (repo secret), not GitHub's
# OIDC/Pages tokens, so contents:read is all we need.
permissions:
  contents: read

# Serialize deploys so two quick pushes don't race to publish.
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Embedding pipeline (Python 3.12 + sentence-transformers) ----
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install pipeline deps
        working-directory: pipeline
        run: uv sync --frozen

      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-${{ hashFiles('pipeline/uv.lock') }}

      - name: Build chunks.json + embeddings.bin
        working-directory: pipeline
        run: uv run chunk_and_embed.py

      - name: Build calendar.json
        working-directory: pipeline
        run: uv run build_calendar.py

      - name: Build degree_programs.json
        working-directory: pipeline
        run: uv run build_programs.py

      # ---- Vite build ----
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        # `npm install` over `npm ci`: the lockfile is generated on Windows
        # and skips Linux-only platform-optional packages (e.g. the linux-x64
        # binary of @tailwindcss/oxide), so `npm ci` blows up under "Missing
        # @emnapi/core ... from lock file". `npm install` resolves them on
        # the runner.
        run: npm install --no-audit --no-fund

      - name: Build web
        working-directory: web
        run: npm run build
        env:
          # Served at the root of the custom domain (https://reodite.com/) on
          # Cloudflare Pages, not a GitHub Pages sub-path, so the Vite base is
          # "/". This matches the default in web/vite.config.ts; set explicitly
          # so the deploy never silently regresses if the default changes.
          VITE_BASE_PATH: /

      # ---- Publish to Cloudflare Pages (Direct Upload) ----
      # The heavy Python/torch embedding build above stays in GitHub Actions
      # (with HF caching); we hand the finished web/dist to Cloudflare. Requires
      # repo secrets CLOUDFLARE_API_TOKEN (scope: Account › Cloudflare Pages ›
      # Edit) and CLOUDFLARE_ACCOUNT_ID.

      # First run creates the project and pins its production branch to `master`
      # so the `--branch=master` deploy below counts as a PRODUCTION deploy (the
      # one the custom domain serves). On every later run this command fails
      # with "project already exists" — continue-on-error swallows that; the
      # deploy step is the real gate.
      - name: Ensure Pages project exists
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create reodite --production-branch master

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=reodite --branch=master
