name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Embedding pipeline (Python 3.12 + sentence-transformers) ----
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install pipeline deps
        working-directory: pipeline
        run: uv sync --frozen

      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-${{ hashFiles('pipeline/uv.lock') }}

      - name: Build chunks.json + embeddings.bin
        working-directory: pipeline
        run: uv run chunk_and_embed.py

      - name: Build calendar.json
        working-directory: pipeline
        run: uv run build_calendar.py

      - name: Build degree_programs.json
        working-directory: pipeline
        run: uv run build_programs.py

      # ---- Vite build ----
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        # `npm install` over `npm ci`: the lockfile is generated on Windows
        # and skips Linux-only platform-optional packages (e.g. the linux-x64
        # binary of @tailwindcss/oxide), so `npm ci` blows up under "Missing
        # @emnapi/core ... from lock file". `npm install` resolves them on
        # the runner.
        run: npm install --no-audit --no-fund

      - name: Build web
        working-directory: web
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages with GitHub Actions as the source if it ever
          # gets disabled in repo settings (otherwise this step 404s with
          # "Get Pages site failed" and the whole deploy aborts).
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
