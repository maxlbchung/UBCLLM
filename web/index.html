    <script>
      // Apply persisted theme + zoom before React mounts so a Light-mode
      // (or non-100% zoom) reload doesn't flash the Dark palette / 100%
      // size for a frame while the useEffect in App.tsx catches up.
      // Reads the same localStorage key and JSON shape that
      // store/settings.ts persists.
      (function () {
        try {
          var raw = localStorage.getItem('reodite-settings')
          if (!raw) return
          var saved = JSON.parse(raw)
          var state = saved && saved.state
          if (!state) return
          var theme = state.theme
          if (
            theme === 'light' ||
            theme === 'dark' ||
            theme === 'royal' ||
            theme === 'terminal'
          ) {
            document.documentElement.setAttribute('data-theme', theme)
          }
          var zoom = state.zoom
          if (zoom === 75 || zoom === 100 || zoom === 125) {
            document.documentElement.style.fontSize = (20 * zoom) / 100 + 'px'
          }
        } catch (e) {
          /* ignore — default :root palette + index.css font-size apply */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
